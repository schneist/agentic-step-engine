# knowledge/context.yaml
# Gerüst, Cache, nicht Quelle. Quelle ist der Code.
# Jeder Eintrag: id, type, status, source (Code-Pfad#Symbol oder Datei), verified (Datum, an dem Eintrag und Quelle übereinstimmten).
# status: Code-Einträge, Evals, Flows: planned|implemented|superseded. Entscheidungen: decided|superseded. Offene Punkte: open|resolved. Referenzen: kein status.
# IDs von Entscheidungen und offenen Punkten wie in findings.md: "D#n", "O#n".
# Kanten: implements (interpreter→operation), guards (invariant→interpreter), tested_by (invariant→Test-Symbol), decided_by (→decision), measured_by (decision→eval).
# Nichts eintragen, was nur in einer Modellantwort stand und nie im Code gelandet ist.

