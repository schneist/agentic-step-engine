invariants:
  - id: inv.nothingUnchecked
    type: invariant
    status: planned
    source: SPEC.md#IDEE
    verified: 2026-10-27
    statement: Nichts wird ausgeführt, was nicht vorher geprüft wurde; Execute nimmt nur ApprovedTerm, und der entsteht nur aus CheckedTerm plus bestätigtem Hash.
    guards: [int.execute, int.approval]
    tested_by: [ase.coretests.VisibilitySuite, ase.core.ApprovalSuite]
    decided_by: ["D#11"]
    note: Typseite fertig; Execute in Schritt 3
  - id: inv.attenuation
    type: invariant
    status: implemented
    source: core/src/main/scala/ase/core/Attenuation.scala#Attenuation.check
    verified: 2026-10-27
    statement: Innere Hülle nie weiter als äußere; maxDepth strikt kleiner; WorstCaseSteps ≤ parent.maxSteps.
    guards: [int.dryRun]
    tested_by: ["ase.core.CoreLaws.envelope", ase.core.DryRunSuite]
  - id: inv.wellFormedHole
    type: invariant
    status: implemented
    source: core/src/main/scala/ase/core/Attenuation.scala#Attenuation.wellFormed
    verified: 2026-10-27
    statement: maxSteps ≥ 1, allowedOps nicht leer, maxDepth ≥ 0, Shell ⇔ shellAllowlist nicht leer.
    guards: [int.dryRun]
    tested_by: [ase.core.DryRunSuite]
  - id: inv.interpretersReadOnly
    type: invariant
    status: implemented
    source: core/src/main/scala/ase/core/AgentAlg.scala#AgentAlg
    verified: 2026-10-27
    statement: Interpreter verändern den Term nie; Produkt kommutativ.
    guards: [int.dryRun, int.cost, int.explain, int.execute, int.replay]
    tested_by: ["ase.core.CoreLaws.term"]
  - id: inv.roundtrip
    type: invariant
    status: implemented
    source: core/src/main/scala/ase/core/Codec.scala#Codec
    verified: 2026-10-27
    statement: JSON-Roundtrip identisch (mit origin und in Modellform); toTerm(program(t)) == t; Schema validiert alle generierten Terme bis zur Verschachtelungsgrenze.
    guards: [int.toTerm]
    tested_by: ["ase.core.CoreLaws.term", ase.core.SchemaSuite, ase.core.AlgebraSuite]
  - id: inv.replayEqualsExecute
    type: invariant
    status: planned
    source: SPEC.md#INTERPRETER
    verified: 2026-10-27
    statement: Replay(Record(t)) erzeugt dieselbe Ereignisfolge; Schreibvorgänge auf frische Fixture-Kopie ergeben denselben Dateibaum.
    guards: [int.replay, int.execute]
    tested_by: []
    decided_by: ["D#16"]
  - id: inv.adversarialFill
    type: invariant
    status: planned
    source: SPEC.md#TESTS
    verified: 2026-10-27
    statement: Für beliebige Terme und beliebige Modellantworten führt Execute nie einen Syscall außerhalb von Wurzel- oder Loch-Hülle aus (Syscalls der Engine, nicht der Kindprozesse).
    guards: [int.execute, int.dryRun]
    tested_by: ["ase.core.CoreLaws.dryRun"]
    decided_by: ["D#6", "D#12"]
    note: Tor-2-Seite fertig (jeder Ausbruchsversuch abgelehnt); Syscall-Seite mit Execute und Record in Schritt 3
  - id: inv.scopeFiltered
    type: invariant
    status: planned
    source: SPEC.md#TERM-ADT
    verified: 2026-10-27
    statement: Kein Ergebnis mit Pfad außerhalb des pathPrefix eines Lochs erscheint in dessen Fill-Kontext.
    guards: [int.execute]
    tested_by: []
    decided_by: ["D#9"]

